<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" fill="none">
  <!-- Brand Icon Badge -->
  <rect x="4" y="6" width="48" height="48" rx="14" fill="url(#logo_grad)" />
  <rect x="4" y="6" width="48" height="48" rx="14" stroke="#FF4667" stroke-width="1.5" stroke-opacity="0.3" />
  
  <!-- Graduation Cap & Academic Star -->
  <path d="M28 17L14 24.5L28 32L42 24.5L28 17Z" fill="#FFFFFF" />
  <path d="M20 28V36C20 38.5 23.5 41 28 41C32.5 41 36 38.5 36 36V28" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M42 24.5V34" stroke="#FFD1D9" stroke-width="2" stroke-linecap="round" />
  <circle cx="42" cy="35" r="1.8" fill="#FF4667" />

  <!-- Brand Typography -->
  <text x="64" y="32" font-family="'Inter', -apple-system, sans-serif" font-size="22" font-weight="800" fill="#1E293B" letter-spacing="-0.5">
    Edu<tspan fill="#FF4667">Institute</tspan>
  </text>
  <text x="65" y="46" font-family="'Inter', -apple-system, sans-serif" font-size="9" font-weight="700" fill="#64748B" letter-spacing="2">
    ACADEMIC PORTAL
  </text>

  <!-- Gradients -->
  <defs>
    <linearGradient id="logo_grad" x1="4" y1="6" x2="52" y2="54" gradientUnits="userSpaceOnUse">
      <stop stop-color="#392C7D" />
      <stop offset="1" stop-color="#FF4667" />
    </linearGradient>
  </defs>
</svg>
